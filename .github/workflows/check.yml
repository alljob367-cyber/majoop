name: Contrôle qualité
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntaxe JS de docs/index.html (extraction + node --check)
        run: |
          python3 -c "
          import re
          html = open('docs/index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          open('/tmp/check.js', 'w', encoding='utf-8').write('\n;\n'.join(scripts))
          print(len(scripts), 'bloc(s) script')
          "
          node --check /tmp/check.js
          echo "OK — le moteur d'app compile"
